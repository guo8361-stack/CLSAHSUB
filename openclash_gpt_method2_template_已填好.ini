[custom]
; 这是给 OpenClash 在线订阅转换 / subconverter 用的外部配置模板
; 用途：为 ChatGPT / OpenAI 生成固定国家优先级的专用策略组

; 生成规则
enable_rule_generator=true
overwrite_original_rules=false

; 使用 Clash 基础模板
clash_rule_base=base/forcerule.yml

; OpenAI / ChatGPT 规则
ruleset=GPT_AUTO,clash-classic:https://raw.githubusercontent.com/guo8361-stack/CLSAHSUB/main/openclash_openai_domains.list,86400

; 收尾规则（未命中时走普通选择组）
ruleset=节点选择,[]FINAL

; 普通主组
custom_proxy_group=节点选择`select`[]自动选择`[]故障转移`[]DIRECT`.*
custom_proxy_group=自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=故障转移`fallback`.*`http://www.gstatic.com/generate_204`300

; GPT 专用组：同国家内部按延迟选，国家之间按固定顺序 fallback
custom_proxy_group=GPT_日本`url-test`(日本|日|JP|Japan|东京|大阪|🇯🇵)`https://chatgpt.com/cdn-cgi/trace`600,,150
custom_proxy_group=GPT_美国`url-test`(美国|美|US|USA|United States|洛杉矶|纽约|西雅图|亚特兰大|凤凰城|🇺🇸)`https://chatgpt.com/cdn-cgi/trace`600,,150
custom_proxy_group=GPT_新加坡`url-test`(新加坡|SG|Singapore|🇸🇬)`https://chatgpt.com/cdn-cgi/trace`600,,150
custom_proxy_group=GPT_AUTO`fallback`[]GPT_日本`[]GPT_美国`[]GPT_新加坡`https://chatgpt.com/cdn-cgi/trace`600
